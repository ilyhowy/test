name: Build Windows EXE

on: [push, workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Requirements
      run: |
        python -m pip install --upgrade pip
        python -m pip install pyinstaller requests PyQt5 PyQtWebEngine pypresence

    - name: Build EXE with PyInstaller
      run: |
        python -m PyInstaller --onefile --noconsole --collect-all PyQt5 --collect-all PyQtWebEngine --hidden-import=requests launcher.py

    - name: Upload Finished EXE
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Executable
        path: dist/
